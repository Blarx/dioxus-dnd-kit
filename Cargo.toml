[package]
name = "dioxus-dnd-kit"
version = "0.4.0"
authors = ["Alexandr <flatbusy@gmail.com>"]
edition = "2024"
repository = "https://github.com/Blarx/dioxus-dnd-kit"
description = "Drag-and-drop toolkit for Dioxus with sortable lists, cross-list transfers, and auto-scroll."
license = "MIT OR Apache-2.0"
keywords = ["dioxus", "drag-and-drop", "sortable", "dnd", "wasm"]
categories = ["gui", "web-programming", "wasm"]
readme = "readme.md"
exclude = [".github", "dist", "target"]

[dependencies]
dioxus = { version = "0.7" }
dioxus-floating = { version = "0.3" }
futures = { version = "0.3" }
gloo-timers = { version = "0.3", features = ["futures"] }

[[example]]
name = "simple_list"
path = "examples/simple_list.rs"

[[example]]
name = "resizable_list"
path = "examples/resizable_list.rs"

[[example]]
name = "relative_list"
path = "examples/relative_list.rs"

[[example]]
name = "connected_lists"
path = "examples/connected_lists.rs"
